name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/space_mining_test
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/space_mining_test
  E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/space_mining_test
  BETTER_AUTH_SECRET: ci-only-secret-5b8f2c1e9a7d4f3b6e0c8a2d9f1b7e4c
  CRON_SECRET: ci-only-cron-secret-3e9a1f7c5b2d
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: space_mining_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate
        run: npm run db:migrate
      - name: Unit + integration tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: space-material-mining:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name app -p 3000:3000 \
            -e DATABASE_URL=postgres://nobody:nobody@127.0.0.1:1/none \
            -e BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET -e CRON_SECRET=$CRON_SECRET \
            space-material-mining:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs app; exit 1
